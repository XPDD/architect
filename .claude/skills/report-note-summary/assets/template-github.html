<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康奈尔笔记 — {{REPORT_TITLE}}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-header: #24292f;
    --bg-subtle: #f6f8fa;
    --bg-cue: #f6f8fa;
    --border: #d0d7de;
    --border-light: #eaeef2;
    --text-primary: #1f2328;
    --text-secondary: #656d76;
    --text-muted: #8c959f;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --green: #1a7f37;
    --green-soft: #dafbe1;
    --orange: #bf8700;
    --orange-soft: #fff8c5;
    --purple: #8250df;
    --purple-soft: #fbefff;
    --radius: 6px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Helvetica, Arial, sans-serif;
    --font-mono: 'SF Mono', 'Menlo', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
  }

  body {
    font-family: var(--font-sans);
    color: var(--text-primary);
    background: #f6f8fa;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 820px; margin: 32px auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .header {
    background: var(--bg-header);
    padding: 20px 24px;
    border-bottom: 1px solid rgba(255,255,255,.15);
  }
  .header-top { display: flex; align-items: center; gap: 10px; }
  .header-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header-icon svg { width: 20px; height: 20px; fill: rgba(255,255,255,.7); }
  .header-title { font-size: 16px; font-weight: 600; color: #fff; }
  .header-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.6); }
  .header-meta .meta-sep { color: rgba(255,255,255,.2); }

  .cornell {
    display: grid;
    grid-template-columns: 230px 1fr;
    grid-template-rows: auto auto;
    grid-template-areas: "cue notes" "summary summary";
    gap: 0;
  }

  .cornell-cue {
    grid-area: cue;
    background: var(--bg-cue);
    padding: 20px 16px;
    border-right: 1px solid var(--border-light);
  }
  .cue-header {
    font-size: 12px; font-weight: 600; color: var(--text-primary);
    padding-bottom: 12px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .cue-header::before { content: '🔖'; font-size: 14px; }
  .cue-item {
    font-size: 13px; color: var(--text-secondary); line-height: 1.65;
    padding: 8px 10px; margin-bottom: 8px;
    border-radius: var(--radius);
    background: var(--bg);
    border: 1px solid var(--border-light);
    border-left: 3px solid var(--accent);
    font-weight: 500;
    position: relative;
  }
  .cue-item .q-mark { color: var(--accent); font-weight: 700; margin-right: 4px; }

  .cornell-notes { grid-area: notes; padding: 20px 24px; }
  .notes-header {
    font-size: 12px; font-weight: 600; color: var(--text-primary);
    padding-bottom: 12px; margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .notes-header::before { content: '📋'; font-size: 14px; }
  .note-section { margin-bottom: 14px; }
  .note-section h4 {
    font-size: 14px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
  }
  .note-section h4::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
  .note-section ul { list-style: none; padding-left: 0; }
  .note-section ul li {
    padding: 2px 0 2px 22px; position: relative;
    font-size: 13.5px; line-height: 1.8; color: var(--text-primary);
  }
  .note-section ul li::before {
    content: ''; position: absolute; left: 6px; top: 10px;
    width: 6px; height: 6px;
    border: 1.5px solid var(--border); border-radius: 50%;
  }
  .note-highlight {
    display: inline; background: #fff1e5; padding: 1px 6px;
    border-radius: 3px; font-weight: 600; color: #cf222e;
  }

  .feynman {
    margin-top: 14px; padding: 14px 16px;
    background: var(--green-soft);
    border-radius: var(--radius);
    border: 1px solid rgba(26,127,55,.15);
    border-left: 3px solid var(--green);
  }
  .feynman-label {
    font-size: 11px; font-weight: 600; color: var(--green);
    margin-bottom: 6px; font-family: var(--font-mono);
  }
  .feynman p { font-size: 13.5px; color: #1f2328; line-height: 1.8; }
  .feynman p strong { color: var(--green); }

  .diagram {
    margin-top: 14px; padding: 16px;
    background: var(--bg-subtle);
    border-radius: var(--radius);
    border: 1px solid var(--border-light);
    overflow-x: auto;
  }
  .diagram-label {
    font-size: 11px; font-weight: 600; color: var(--purple);
    margin-bottom: 12px; font-family: var(--font-mono);
  }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; margin: 6px 0; }
  .flow-box {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--text-primary); text-align: center; white-space: nowrap;
  }
  .flow-box.accent { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .flow-box.primary { background: var(--bg-header); border-color: var(--bg-header); color: #fff; font-weight: 600; }
  .flow-box.warn { border-color: var(--orange); background: var(--orange-soft); color: var(--orange); }
  .flow-arrow { width: 28px; color: var(--text-muted); font-size: 14px; text-align: center; flex-shrink: 0; }
  .flow-v-arrow { text-align: center; color: var(--text-muted); font-size: 14px; line-height: 1; margin: 3px 0; }

  .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .compare-table thead th {
    background: var(--bg-subtle); color: var(--text-primary); font-weight: 600;
    text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border);
    font-size: 12px;
  }
  .compare-table tbody td {
    padding: 8px 12px; border-bottom: 1px solid var(--border-light);
    color: var(--text-primary); font-size: 13px;
  }
  .compare-table tbody tr:nth-child(even) td { background: rgba(246,248,250,.5); }

  .cornell-summary {
    grid-area: summary;
    padding: 16px 24px;
    background: linear-gradient(180deg, var(--bg-subtle), var(--bg));
    border-top: 2px solid var(--border);
  }
  .cornell-summary h3 {
    font-size: 12px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .cornell-summary h3::before { content: '💡'; font-size: 14px; }
  .cornell-summary .summary-text {
    font-size: 14px; font-weight: 500; color: var(--text-primary);
    line-height: 1.7; padding: 12px 16px;
    background: var(--bg); border: 1px solid var(--border-light);
    border-radius: var(--radius); border-left: 3px solid var(--accent);
  }
  .cornell-summary .summary-text strong { color: var(--accent); }
  .summary-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tag {
    font-size: 11px; padding: 2px 10px; border-radius: 20px;
    background: var(--bg-subtle); color: var(--text-secondary);
    border: 1px solid var(--border-light); font-weight: 500;
  }
  .tag.primary {
    background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600;
  }

  /* === 高密度组件 === */
  .numbered-header {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 600; color: var(--text-primary);
    margin: 16px 0 12px;
  }
  .numbered-header .num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 6px;
    background: var(--bg-header); color: #fff;
    font-family: var(--font-mono); font-size: 13px; font-weight: 600;
    border-radius: var(--radius);
  }

  .vs-block {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 12px; align-items: stretch; margin: 12px 0;
  }
  .vs-col {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .vs-col.vs-old { border-left: 3px solid #cf222e; }
  .vs-col.vs-new { border-left: 3px solid var(--green); background: rgba(218,251,225,.3); }
  .vs-title { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .vs-old .vs-title { color: #cf222e; }
  .vs-new .vs-title { color: var(--green); }
  .vs-col ul { list-style: none; }
  .vs-col ul li {
    font-size: 12.5px; color: var(--text-primary); line-height: 1.7;
    padding-left: 16px; position: relative;
  }
  .vs-col ul li::before { content: ''; position: absolute; left: 4px; top: 10px; width: 6px; height: 6px; border: 1.5px solid var(--border); border-radius: 50%; }
  .vs-arrow { display: flex; align-items: center; color: var(--text-muted); font-size: 18px; }

  .card-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin: 12px 0;
  }
  .card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .card-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    margin-bottom: 6px;
  }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
  .card-list { list-style: none; }
  .card-list li {
    font-size: 12.5px; color: var(--text-primary); line-height: 1.7;
    padding-left: 14px; position: relative;
  }
  .card-list li::before { content: ''; position: absolute; left: 3px; top: 9px; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }

  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px; margin: 12px 0;
  }
  .stat-item {
    text-align: center; padding: 10px 8px;
    background: var(--bg-subtle); border: 1px solid var(--border-light);
    border-radius: var(--radius);
  }
  .stat-value { font-family: var(--font-mono); font-size: 18px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .hl-orange { background: var(--orange-soft); color: var(--orange); padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .hl-green  { background: var(--green-soft); color: var(--green); padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .hl-purple { background: var(--purple-soft); color: var(--purple); padding: 1px 6px; border-radius: 3px; font-weight: 600; }

  /* === Mobile (≤ 768px) === */
  @media (max-width: 768px) {
    .page { max-width: 100%; margin: 0; border-radius: 0; border: none; }
    .header { padding: 16px; }
    .header-title { font-size: 14px; }
    .header-meta { flex-wrap: wrap; gap: 8px; font-size: 11px; }

    .cornell {
      grid-template-columns: 1fr;
      grid-template-areas: "cue" "notes" "summary";
    }
    .cornell-cue {
      border-right: none;
      border-bottom: 1px solid var(--border-light);
      padding: 16px;
    }
    .cornell-notes { padding: 16px; }
    .cornell-summary { padding: 16px; }
    .cornell-summary .summary-text { font-size: 13px; }

    .cue-header, .notes-header { font-size: 11px; margin-bottom: 12px; padding-bottom: 10px; }
    .cue-item { font-size: 12px; padding: 6px 8px; }
    .note-section { margin-bottom: 12px; }
    .note-section h4 { font-size: 13px; }
    .note-section ul li { font-size: 12.5px; }

    .feynman, .diagram { margin-top: 12px; padding: 12px; }
    .feynman p { font-size: 12.5px; }

    .vs-block { grid-template-columns: 1fr; gap: 8px; }
    .vs-arrow { justify-content: center; transform: rotate(90deg); padding: 4px 0; }
    .card-grid { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 16px; }

    .flow-row { gap: 2px; }
    .flow-box { padding: 6px 10px; font-size: 12px; }
    .flow-arrow { width: 20px; font-size: 12px; }

    .compare-table { font-size: 11px; display: block; overflow-x: auto; }
    .compare-table thead th, .compare-table tbody td { padding: 6px 8px; }

    .numbered-header { font-size: 14px; margin: 12px 0 10px; }
    .summary-tags { gap: 6px; }
    .tag { font-size: 10px; padding: 2px 8px; }
  }

  @media print {
    body { background: #fff; }
    .page { max-width: 100%; margin: 0; border: none; box-shadow: none; page-break-after: always; }
    .cornell-cue { background: #fafbfc; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-top">
      <div class="header-icon">
        <svg viewBox="0 0 16 16"><path d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8z"/></svg>
      </div>
      <div class="header-title">{{REPORT_TITLE}}</div>
    </div>
    <div class="header-meta">
      <span>{{DATE}}</span><span class="meta-sep">·</span>
      <span>{{AUTHOR}}</span><span class="meta-sep">·</span>
      <span>{{CATEGORY}}</span>
    </div>
  </div>
  <div class="cornell">
    <div class="cornell-cue"><div class="cue-header">线索</div>{{CUE_ITEMS}}</div>
    <div class="cornell-notes">
      <div class="notes-header">核心要点</div>{{NOTE_SECTIONS}}
      <div class="feynman"><div class="feynman-label">💬 费曼笔记</div><p>{{FEYNMAN_EXPLANATION}}</p></div>
      <div class="diagram"><div class="diagram-label">📊 逻辑关系</div>{{DIAGRAM_CONTENT}}</div>
    </div>
    <div class="cornell-summary">
      <h3>总结</h3>
      <div class="summary-text">{{SUMMARY}}</div>
      <div class="summary-tags">{{TAGS}}</div>
    </div>
  </div>
</div>
</body>
</html>
