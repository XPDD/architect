<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康奈尔笔记 — {{REPORT_TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0e17;
    --bg-card: #111620;
    --bg-surface: #161c28;
    --bg-elevated: #1a2030;
    --bg-cue: #0d1320;
    --border-subtle: rgba(255,255,255,.04);
    --border-default: rgba(255,255,255,.06);
    --border-glow: rgba(0,212,255,.12);
    --text-primary: rgba(255,255,255,.92);
    --text-secondary: rgba(255,255,255,.55);
    --text-muted: rgba(255,255,255,.28);
    --cyan: #00d4ff;
    --cyan-glow: rgba(0,212,255,.25);
    --cyan-soft: rgba(0,212,255,.08);
    --blue: #4d7cff;
    --blue-glow: rgba(77,124,255,.3);
    --blue-soft: rgba(77,124,255,.08);
    --purple: #a78bfa;
    --purple-soft: rgba(167,139,250,.08);
    --green: #34d399;
    --green-soft: rgba(52,211,153,.08);
    --amber: #fbbf24;
    --amber-soft: rgba(251,191,36,.08);
    --radius: 6px;
    --radius-lg: 10px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  }

  body {
    font-family: var(--font-sans);
    color: var(--text-primary);
    background: #05080e;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(0,212,255,.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(77,124,255,.03) 0%, transparent 50%);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
  }

  .page {
    max-width: 840px;
    margin: 36px auto;
    background: var(--bg-card);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(0,212,255,.04),
      0 4px 32px rgba(0,0,0,.4),
      0 24px 80px rgba(0,0,0,.3);
    position: relative;
  }
  .page::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: var(--radius-lg);
    padding: 1px;
    background: linear-gradient(135deg, rgba(0,212,255,.15), transparent 30%, transparent 70%, rgba(77,124,255,.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 0;
  }

  /* === Header === */
  .header {
    background:
      linear-gradient(180deg, rgba(0,212,255,.04) 0%, transparent 100%),
      var(--bg-elevated);
    padding: 30px 44px 26px;
    position: relative;
    border-bottom: 1px solid var(--border-default);
    z-index: 1;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--blue), transparent);
  }
  .header-top {
    display: flex; align-items: flex-start; gap: 16px;
  }
  .header-brand {
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  .header-badge {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, rgba(0,212,255,.15), rgba(77,124,255,.1));
    border: 1px solid rgba(0,212,255,.2);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .header-badge::after {
    content: '';
    position: absolute;
    inset: 2px;
    border-radius: 4px;
    border: 1px solid rgba(0,212,255,.1);
  }
  .header-badge-icon {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 12px var(--cyan-glow);
    position: relative;
    z-index: 1;
  }
  .header-title-group { flex: 1; }
  .header-kicker {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 600;
    color: var(--cyan);
    letter-spacing: .2em;
    margin-bottom: 4px;
  }
  .header-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -.02em;
    line-height: 1.3;
  }
  .header-meta {
    display: flex; gap: 20px; margin-top: 14px;
    font-size: 12px; color: var(--text-muted);
    font-family: var(--font-mono);
    letter-spacing: .04em;
  }
  .header-meta .meta-item {
    display: flex; align-items: center; gap: 8px;
  }
  .header-meta .meta-dot {
    width: 5px; height: 5px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--cyan-glow);
  }

  /* === Cornell Grid === */
  .cornell {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: auto auto;
    grid-template-areas:
      "cue notes"
      "summary summary";
    gap: 0;
    position: relative;
    z-index: 1;
  }

  /* === Cue Column === */
  .cornell-cue {
    grid-area: cue;
    background:
      linear-gradient(180deg, rgba(0,212,255,.02), transparent 80%),
      var(--bg-cue);
    padding: 24px 18px;
    border-right: 1px solid rgba(0,212,255,.06);
    position: relative;
  }
  .cue-header {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: .18em;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(0,212,255,.08);
  }
  .cue-item {
    font-size: 13px;
    color: rgba(255,255,255,.7);
    line-height: 1.65;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: var(--radius);
    background: rgba(255,255,255,.02);
    border: 1px solid transparent;
    transition: all .2s;
    font-weight: 500;
    position: relative;
  }
  .cue-item .q-mark {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 20px; height: 20px;
    border-radius: 4px;
    background: rgba(0,212,255,.1);
    border: 1px solid rgba(0,212,255,.15);
    color: var(--cyan);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
    flex-shrink: 0;
  }

  /* === Notes Column === */
  .cornell-notes {
    grid-area: notes;
    padding: 24px 32px 20px;
  }
  .notes-header {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--blue);
    letter-spacing: .18em;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(77,124,255,.08);
  }
  .note-section { margin-bottom: 16px; }
  .note-section:last-child { margin-bottom: 0; }
  .note-section h4 {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
    letter-spacing: .01em;
  }
  .note-section h4 .dot {
    width: 6px; height: 6px;
    border-radius: 1px;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan-glow);
    flex-shrink: 0;
  }
  .note-section > p, .note-section > ul {
    font-size: 13.5px;
    color: rgba(255,255,255,.78);
    line-height: 1.8;
  }
  .note-section ul { list-style: none; padding-left: 0; }
  .note-section ul li {
    padding: 2px 0 2px 22px;
    position: relative;
  }
  .note-section ul li::before {
    content: '';
    position: absolute;
    left: 6px; top: 9px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(0,212,255,.4);
  }
  .note-highlight {
    display: inline;
    background: linear-gradient(180deg, transparent 58%, rgba(0,212,255,.12) 58%);
    padding: 0 2px;
    font-weight: 600;
    color: var(--cyan);
  }

  /* === Feynman Block === */
  .feynman {
    margin-top: 18px;
    padding: 18px 20px;
    background: linear-gradient(135deg, rgba(52,211,153,.04), rgba(52,211,153,.01));
    border-radius: var(--radius);
    border: 1px solid rgba(52,211,153,.1);
    border-left: 2px solid var(--green);
    position: relative;
  }
  .feynman::before {
    content: '✦';
    position: absolute;
    right: 16px; top: 14px;
    font-size: 14px;
    color: var(--green);
    opacity: .5;
  }
  .feynman-label {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--green);
    letter-spacing: .14em;
    margin-bottom: 8px;
  }
  .feynman p {
    font-size: 13.5px;
    color: rgba(255,255,255,.7);
    line-height: 1.8;
  }
  .feynman p strong { color: var(--green); }

  /* === Diagram Area === */
  .diagram {
    margin-top: 18px;
    padding: 18px 20px;
    background: rgba(255,255,255,.01);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,.04);
    overflow-x: auto;
  }
  .diagram-label {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--purple);
    letter-spacing: .14em;
    margin-bottom: 14px;
  }
  .diagram svg, .diagram img {
    max-width: 100%;
    display: block;
    margin: 0 auto;
  }

  /* Flow chart */
  .flow-row {
    display: flex; align-items: center; justify-content: center;
    gap: 0; flex-wrap: wrap;
    margin: 8px 0;
  }
  .flow-box {
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: var(--radius);
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,.7);
    text-align: center;
    white-space: nowrap;
    letter-spacing: .01em;
  }
  .flow-box.accent {
    border-color: rgba(0,212,255,.2);
    background: rgba(0,212,255,.06);
    color: var(--cyan);
    font-weight: 700;
    box-shadow: 0 0 16px rgba(0,212,255,.08), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .flow-box.primary {
    border-color: rgba(77,124,255,.25);
    background: rgba(77,124,255,.08);
    color: var(--blue);
    font-weight: 700;
    box-shadow: 0 0 16px rgba(77,124,255,.08);
  }
  .flow-box.warn {
    border-color: rgba(251,191,36,.2);
    background: rgba(251,191,36,.05);
    color: var(--amber);
  }
  .flow-arrow {
    display: flex; align-items: center; justify-content: center;
    width: 32px;
    color: rgba(255,255,255,.15);
    font-size: 16px;
    flex-shrink: 0;
    font-weight: 300;
  }
  .flow-v-arrow {
    display: flex; justify-content: center;
    color: rgba(255,255,255,.15);
    font-size: 16px;
    line-height: 1;
    margin: 4px 0;
    font-weight: 300;
  }

  /* Compare table */
  .compare-table {
    width: 100%; border-collapse: collapse; font-size: 13px;
  }
  .compare-table thead th {
    background: rgba(255,255,255,.03);
    color: var(--text-secondary);
    font-weight: 600; text-align: left; padding: 9px 14px;
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: .06em;
    border-bottom: 1px solid rgba(0,212,255,.1);
  }
  .compare-table thead th:first-child { border-radius: var(--radius) 0 0 0; }
  .compare-table thead th:last-child  { border-radius: 0 var(--radius) 0 0; }
  .compare-table tbody td {
    padding: 9px 14px;
    border-bottom: 1px solid rgba(255,255,255,.03);
    color: rgba(255,255,255,.75);
    font-size: 13px;
  }
  .compare-table tbody tr:last-child td:first-child { border-radius: 0 0 0 var(--radius); }
  .compare-table tbody tr:last-child td:last-child  { border-radius: 0 0 var(--radius) 0; }
  .compare-table tbody tr:nth-child(even) td { background: rgba(255,255,255,.01); }

  /* === Summary Bar === */
  .cornell-summary {
    grid-area: summary;
    padding: 20px 44px 24px;
    background: linear-gradient(180deg, rgba(255,255,255,.01) 0%, transparent 100%);
    border-top: 1px solid rgba(255,255,255,.04);
    position: relative;
  }
  .cornell-summary::before {
    content: '';
    position: absolute;
    top: 0; left: 44px; right: 44px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0,212,255,.12), var(--cyan), transparent);
  }
  .cornell-summary h3 {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: .18em;
    margin-bottom: 10px;
  }
  .cornell-summary .summary-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.7;
    letter-spacing: .01em;
    padding-left: 16px;
    border-left: 2px solid var(--cyan);
    box-shadow: -4px 0 12px rgba(0,212,255,.06);
  }
  .cornell-summary .summary-text strong {
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan-glow);
  }
  .cornell-summary .summary-tags {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
  }
  .tag {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 3px;
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.06);
    color: var(--text-secondary);
    font-weight: 500;
    font-family: var(--font-mono);
    letter-spacing: .03em;
  }
  .tag.primary {
    background: rgba(0,212,255,.08);
    border-color: rgba(0,212,255,.15);
    color: var(--cyan);
    font-weight: 600;
  }

  /* === 高密度组件 === */
  .numbered-header {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 700; color: var(--text-primary);
    margin: 18px 0 12px;
  }
  .numbered-header .num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 6px;
    background: linear-gradient(135deg, var(--cyan), var(--blue));
    color: #fff; font-family: var(--font-mono); font-size: 13px; font-weight: 700;
    border-radius: 4px;
    box-shadow: 0 0 12px var(--cyan-glow);
  }

  .vs-block {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 12px; align-items: stretch; margin: 12px 0;
  }
  .vs-col {
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .vs-col.vs-old { border-color: rgba(251,191,36,.2); }
  .vs-col.vs-new { border-color: rgba(0,212,255,.25); background: rgba(0,212,255,.04); }
  .vs-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .vs-old .vs-title { color: var(--amber); }
  .vs-new .vs-title { color: var(--cyan); }
  .vs-col ul { list-style: none; }
  .vs-col ul li {
    font-size: 12.5px; color: rgba(255,255,255,.7); line-height: 1.7;
    padding-left: 14px; position: relative;
  }
  .vs-col ul li::before { content: '·'; position: absolute; left: 2px; color: var(--text-muted); }
  .vs-arrow {
    display: flex; align-items: center;
    color: var(--cyan); font-size: 20px;
    text-shadow: 0 0 8px var(--cyan-glow);
  }

  .card-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin: 12px 0;
  }
  .card {
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: var(--radius);
    padding: 12px 14px;
  }
  .card-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 4px;
    background: rgba(77,124,255,.15); border: 1px solid rgba(77,124,255,.25);
    color: var(--blue); font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    margin-bottom: 6px;
  }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; }
  .card-list { list-style: none; }
  .card-list li {
    font-size: 12.5px; color: rgba(255,255,255,.65); line-height: 1.7;
    padding-left: 12px; position: relative;
  }
  .card-list li::before { content: '›'; position: absolute; left: 0; color: var(--cyan); }

  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px; margin: 12px 0;
  }
  .stat-item {
    text-align: center; padding: 10px 8px;
    background: rgba(255,255,255,.02);
    border: 1px solid rgba(255,255,255,.05);
    border-radius: var(--radius);
  }
  .stat-value {
    font-family: var(--font-mono); font-size: 18px; font-weight: 700;
    color: var(--cyan); text-shadow: 0 0 10px var(--cyan-glow);
  }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .hl-orange { color: var(--amber); background: linear-gradient(180deg, transparent 58%, rgba(251,191,36,.15) 58%); padding: 0 2px; font-weight: 600; }
  .hl-green  { color: var(--green); background: linear-gradient(180deg, transparent 58%, rgba(52,211,153,.12) 58%); padding: 0 2px; font-weight: 600; }
  .hl-purple { color: var(--purple); background: linear-gradient(180deg, transparent 58%, rgba(167,139,250,.12) 58%); padding: 0 2px; font-weight: 600; }

  /* === Mobile (≤ 768px) === */
  @media (max-width: 768px) {
    body { min-height: auto; }
    .page {
      max-width: 100%; margin: 0;
      border-radius: 0; border: none;
      box-shadow: none;
    }
    .page::before { display: none; }

    .header { padding: 20px 16px 16px; }
    .header-top { flex-direction: column; gap: 12px; }
    .header-title { font-size: 18px; }
    .header-kicker { font-size: 8px; margin-bottom: 2px; }
    .header-meta { flex-wrap: wrap; gap: 12px; font-size: 11px; }

    .cornell {
      grid-template-columns: 1fr;
      grid-template-areas: "cue" "notes" "summary";
    }
    .cornell-cue {
      border-right: none;
      border-bottom: 1px solid rgba(0,212,255,.06);
      padding: 16px;
    }
    .cornell-notes { padding: 16px; }
    .cornell-summary { padding: 16px; }
    .cornell-summary::before { left: 16px; right: 16px; }
    .cornell-summary .summary-text { font-size: 14px; padding-left: 12px; }

    .cue-header, .notes-header { font-size: 8px; margin-bottom: 14px; padding-bottom: 8px; }
    .cue-item { font-size: 12px; padding: 8px 10px; }

    .note-section { margin-bottom: 12px; }
    .note-section h4 { font-size: 13px; }
    .note-section > p, .note-section > ul { font-size: 12.5px; }

    .feynman, .diagram { margin-top: 14px; padding: 14px; }
    .feynman p { font-size: 12.5px; }

    .vs-block { grid-template-columns: 1fr; gap: 8px; }
    .vs-arrow { justify-content: center; transform: rotate(90deg); padding: 4px 0; }
    .vs-col { padding: 10px 12px; }

    .card-grid { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 16px; }

    .flow-row { gap: 2px; }
    .flow-box { padding: 8px 12px; font-size: 12px; }
    .flow-arrow { width: 20px; font-size: 12px; }

    .compare-table { font-size: 11px; display: block; overflow-x: auto; }
    .compare-table thead th, .compare-table tbody td { padding: 6px 8px; }

    .numbered-header { font-size: 14px; margin: 14px 0 10px; }
    .summary-tags { gap: 6px; }
    .tag { font-size: 10px; padding: 3px 10px; }
    .header-badge { width: 28px; height: 28px; }
    .header-badge-icon { font-size: 13px; }
  }

  /* === Print === */
  @media print {
    body { background: #0a0e17; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page {
      max-width: 100%;
      margin: 0;
      box-shadow: none;
      border: none;
      page-break-after: always;
    }
    .page::before { display: none; }
    .header, .cornell-cue, .cornell-summary, .feynman, .diagram {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ===== HEADER ===== -->
  <div class="header">
    <div class="header-top">
      <div class="header-brand">
        <div class="header-badge">
          <span class="header-badge-icon">N</span>
        </div>
      </div>
      <div class="header-title-group">
        <div class="header-kicker">康奈尔分析</div>
        <div class="header-title">{{REPORT_TITLE}}</div>
      </div>
    </div>
    <div class="header-meta">
      <div class="meta-item"><span class="meta-dot"></span>{{DATE}}</div>
      <div class="meta-item"><span class="meta-dot"></span>{{AUTHOR}}</div>
      <div class="meta-item"><span class="meta-dot"></span>{{CATEGORY}}</div>
    </div>
  </div>

  <!-- ===== CORNELL NOTES ===== -->
  <div class="cornell">

    <!-- Cues -->
    <div class="cornell-cue">
      <div class="cue-header">▸ 线索</div>
      {{CUE_ITEMS}}
    </div>

    <!-- Notes -->
    <div class="cornell-notes">
      <div class="notes-header">▸ 核心要点</div>
      {{NOTE_SECTIONS}}

      <!-- Feynman -->
      <div class="feynman">
        <div class="feynman-label">◆ 费曼</div>
        <p>{{FEYNMAN_EXPLANATION}}</p>
      </div>

      <!-- Diagram -->
      <div class="diagram">
        <div class="diagram-label">◆ 逻辑关系</div>
        {{DIAGRAM_CONTENT}}
      </div>
    </div>

    <!-- Summary -->
    <div class="cornell-summary">
      <h3>▸ 总结</h3>
      <div class="summary-text">{{SUMMARY}}</div>
      <div class="summary-tags">
        {{TAGS}}
      </div>
    </div>
  </div>

</div>

</body>
</html>
