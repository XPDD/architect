<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康奈尔笔记 — {{REPORT_TITLE}}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-subtle: #f5f5f7;
    --text-primary: #1d1d1f;
    --text-secondary: #86868b;
    --text-tertiary: #aeaeb2;
    --border: #d2d2d7;
    --border-light: #e8e8ed;
    --blue: #0071e3;
    --blue-soft: #e8f2fd;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --radius: 12px;
    --radius-sm: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
  }

  body {
    font-family: var(--font-sans);
    color: var(--text-primary);
    background: #f2f2f7;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -.01em;
  }

  .page {
    max-width: 800px;
    margin: 40px auto;
    background: var(--bg);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 2px 8px rgba(0,0,0,.04),
      0 12px 40px rgba(0,0,0,.08);
  }

  .header {
    padding: 36px 44px 28px;
    background: var(--bg);
    border-bottom: 1px solid var(--border-light);
  }
  .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .header-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--blue); flex-shrink: 0;
  }
  .header-label {
    font-size: 11px; font-weight: 600; color: var(--blue);
    letter-spacing: .08em;
  }
  .header-title {
    font-size: 28px; font-weight: 700; color: var(--text-primary);
    line-height: 1.2; letter-spacing: -.02em;
  }
  .header-meta {
    display: flex; gap: 20px; margin-top: 18px;
    font-size: 14px; color: var(--text-secondary);
  }
  .header-meta .meta-sep { color: var(--text-tertiary); }

  .cornell {
    display: grid;
    grid-template-columns: 210px 1fr;
    grid-template-rows: auto auto;
    grid-template-areas: "cue notes" "summary summary";
    gap: 0;
  }

  .cornell-cue {
    grid-area: cue;
    padding: 28px 20px;
    border-right: 1px solid var(--border-light);
    background: linear-gradient(180deg, rgba(0,113,227,.02), transparent);
  }
  .cue-header {
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: .04em; margin-bottom: 20px;
  }
  .cue-item {
    font-size: 14px; color: var(--text-secondary); line-height: 1.5;
    padding: 12px 14px; margin-bottom: 10px;
    border-radius: var(--radius-sm);
    background: rgba(0,113,227,.04);
    font-weight: 500;
    transition: all .2s;
  }
  .cue-item .q-mark { color: var(--blue); font-weight: 700; margin-right: 6px; }

  .cornell-notes { grid-area: notes; padding: 28px 36px 24px; }
  .notes-header {
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: .04em; margin-bottom: 20px;
  }
  .note-section { margin-bottom: 20px; }
  .note-section h4 {
    font-size: 17px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: -.01em;
  }
  .note-section ul { list-style: none; padding-left: 0; }
  .note-section ul li {
    padding: 4px 0 4px 0; font-size: 15px; line-height: 1.65;
    color: var(--text-primary);
  }
  .note-section ul li::before {
    content: '—'; color: var(--blue); margin-right: 10px; font-weight: 400;
  }
  .note-highlight {
    font-weight: 600; color: var(--blue);
    background: rgba(0,113,227,.06); padding: 1px 6px; border-radius: 4px;
  }

  .feynman {
    margin-top: 20px; padding: 20px 22px;
    background: #f9f9fb;
    border-radius: var(--radius);
    border: none;
  }
  .feynman-label {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: .06em; margin-bottom: 8px;
  }
  .feynman p {
    font-size: 15px; color: var(--text-primary); line-height: 1.7; font-weight: 400;
  }
  .feynman p strong { color: var(--text-primary); font-weight: 600; }

  .diagram {
    margin-top: 20px; padding: 20px 22px;
    background: #f9f9fb;
    border-radius: var(--radius);
    overflow-x: auto;
  }
  .diagram-label {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: .06em; margin-bottom: 14px;
  }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; margin: 8px 0; }
  .flow-box {
    background: var(--bg); border: 1px solid var(--border-light); border-radius: var(--radius-sm);
    padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--text-primary); text-align: center; white-space: nowrap;
  }
  .flow-box.accent { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
  .flow-box.primary { background: var(--bg); border-color: var(--blue); color: var(--blue); font-weight: 600; }
  .flow-box.warn { background: #fff9f0; border-color: var(--orange); color: var(--orange); }
  .flow-arrow { width: 40px; color: var(--text-tertiary); font-size: 18px; text-align: center; flex-shrink: 0; }
  .flow-v-arrow { text-align: center; color: var(--text-tertiary); font-size: 18px; line-height: 1; margin: 4px 0; }

  .compare-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .compare-table thead th {
    background: var(--bg); color: var(--text-secondary); font-weight: 600;
    text-align: left; padding: 10px 16px; border-bottom: 2px solid var(--border);
    font-size: 12px; letter-spacing: .04em;
  }
  .compare-table tbody td {
    padding: 12px 16px; border-bottom: 1px solid var(--border-light);
    color: var(--text-primary);
  }

  .cornell-summary {
    grid-area: summary;
    padding: 28px 44px 32px;
    background: var(--bg);
    border-top: 1px solid var(--border-light);
  }
  .cornell-summary h3 {
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    letter-spacing: .04em; margin-bottom: 12px;
  }
  .cornell-summary .summary-text {
    font-size: 17px; font-weight: 600; color: var(--text-primary);
    line-height: 1.55; letter-spacing: -.01em;
  }
  .cornell-summary .summary-text strong { color: var(--blue); font-weight: 700; }
  .summary-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .tag {
    font-size: 12px; padding: 4px 14px; border-radius: 20px;
    background: var(--bg-subtle); color: var(--text-secondary); font-weight: 500;
  }
  .tag.primary {
    background: var(--blue); color: #fff; font-weight: 600;
  }

  /* === 高密度组件 === */
  .numbered-header {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 600; color: var(--text-primary);
    margin: 20px 0 12px; letter-spacing: -.01em;
  }
  .numbered-header .num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 26px; height: 26px; padding: 0 7px;
    background: var(--text-primary); color: #fff;
    font-size: 14px; font-weight: 600; border-radius: 8px;
  }

  .vs-block {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 14px; align-items: stretch; margin: 14px 0;
  }
  .vs-col {
    background: #f9f9fb;
    border-radius: var(--radius); padding: 14px 16px;
  }
  .vs-col.vs-new { background: var(--blue-soft); }
  .vs-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .vs-old .vs-title { color: var(--text-secondary); }
  .vs-new .vs-title { color: var(--blue); }
  .vs-col ul { list-style: none; }
  .vs-col ul li {
    font-size: 13.5px; color: var(--text-primary); line-height: 1.65;
    padding: 2px 0;
  }
  .vs-col ul li::before { content: '·'; color: var(--text-tertiary); margin-right: 8px; font-weight: 700; }
  .vs-arrow { display: flex; align-items: center; color: var(--text-tertiary); font-size: 20px; }

  .card-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; margin: 14px 0;
  }
  .card {
    background: #f9f9fb;
    border-radius: var(--radius); padding: 14px 16px;
  }
  .card-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 7px;
    background: var(--blue); color: #fff;
    font-size: 12px; font-weight: 600; margin-bottom: 8px;
  }
  .card-title { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
  .card-list { list-style: none; }
  .card-list li {
    font-size: 13.5px; color: var(--text-primary); line-height: 1.65;
    padding: 2px 0;
  }
  .card-list li::before { content: '·'; color: var(--blue); margin-right: 8px; font-weight: 700; }

  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px; margin: 14px 0;
  }
  .stat-item {
    text-align: center; padding: 14px 8px;
    background: #f9f9fb; border-radius: var(--radius);
  }
  .stat-value { font-size: 24px; font-weight: 700; color: var(--text-primary); letter-spacing: -.02em; }
  .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

  .hl-orange { color: var(--orange); font-weight: 600; }
  .hl-green  { color: var(--green); font-weight: 600; }
  .hl-red    { color: var(--red); font-weight: 600; }

  /* === Mobile (≤ 768px) === */
  @media (max-width: 768px) {
    .page { max-width: 100%; margin: 0; border-radius: 0; box-shadow: none; }
    .header { padding: 24px 16px 20px; }
    .header-title { font-size: 22px; }
    .header-meta { flex-wrap: wrap; gap: 12px; font-size: 13px; }

    .cornell {
      grid-template-columns: 1fr;
      grid-template-areas: "cue" "notes" "summary";
    }
    .cornell-cue {
      border-right: none;
      border-bottom: 1px solid var(--border-light);
      padding: 20px 16px;
    }
    .cornell-notes { padding: 20px 16px; }
    .cornell-summary { padding: 20px 16px; }
    .cornell-summary .summary-text { font-size: 15px; }

    .cue-header, .notes-header { font-size: 11px; margin-bottom: 14px; }
    .cue-item { font-size: 13px; padding: 10px 12px; }
    .note-section { margin-bottom: 16px; }
    .note-section h4 { font-size: 15px; }
    .note-section ul li { font-size: 13.5px; }

    .feynman, .diagram { margin-top: 16px; padding: 16px; }
    .feynman p { font-size: 13.5px; }

    .vs-block { grid-template-columns: 1fr; gap: 10px; }
    .vs-arrow { justify-content: center; transform: rotate(90deg); padding: 4px 0; }
    .card-grid { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 20px; }

    .flow-row { gap: 2px; }
    .flow-box { padding: 10px 14px; font-size: 13px; }
    .flow-arrow { width: 30px; font-size: 16px; }

    .compare-table { font-size: 12px; display: block; overflow-x: auto; }
    .compare-table thead th, .compare-table tbody td { padding: 8px 10px; }

    .numbered-header { font-size: 15px; margin: 16px 0 10px; }
    .summary-tags { gap: 6px; }
    .tag { font-size: 11px; padding: 3px 12px; }
  }

  @media print {
    body { background: #fff; }
    .page { max-width: 100%; margin: 0; box-shadow: none; border-radius: 0; page-break-after: always; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-top">
      <div class="header-dot"></div>
      <div class="header-label">康奈尔笔记</div>
    </div>
    <div class="header-title">{{REPORT_TITLE}}</div>
    <div class="header-meta">
      <span>{{DATE}}</span><span class="meta-sep">·</span>
      <span>{{AUTHOR}}</span><span class="meta-sep">·</span>
      <span>{{CATEGORY}}</span>
    </div>
  </div>
  <div class="cornell">
    <div class="cornell-cue"><div class="cue-header">线索</div>{{CUE_ITEMS}}</div>
    <div class="cornell-notes">
      <div class="notes-header">核心要点</div>{{NOTE_SECTIONS}}
      <div class="feynman"><div class="feynman-label">费曼笔记</div><p>{{FEYNMAN_EXPLANATION}}</p></div>
      <div class="diagram"><div class="diagram-label">逻辑关系</div>{{DIAGRAM_CONTENT}}</div>
    </div>
    <div class="cornell-summary">
      <h3>总结</h3>
      <div class="summary-text">{{SUMMARY}}</div>
      <div class="summary-tags">{{TAGS}}</div>
    </div>
  </div>
</div>
</body>
</html>
