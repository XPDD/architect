<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康奈尔笔记 — {{REPORT_TITLE}}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy: #141829;
    --navy-light: #1e2640;
    --gold: #c4a55a;
    --gold-light: #d4bc6e;
    --gold-pale: #faf5e8;
    --gold-border: #e8d9b0;
    --cream: #faf8f5;
    --white: #ffffff;
    --text-primary: #1a1d28;
    --text-secondary: #6b6f7c;
    --text-muted: #9498a6;
    --border: #e4e6eb;
    --border-light: #eef0f4;
    --cue-bg: #f5f6fa;
    --cue-accent: #3a4780;
    --accent-green: #2d8a6e;
    --accent-green-soft: #ecf7f2;
    --shadow-sm: 0 1px 2px rgba(20,24,41,.04);
    --shadow-md: 0 4px 24px rgba(20,24,41,.06), 0 1px 4px rgba(20,24,41,.04);
    --shadow-lg: 0 8px 40px rgba(20,24,41,.08), 0 2px 8px rgba(20,24,41,.04);
    --radius-sm: 4px;
    --radius: 6px;
    --radius-lg: 10px;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }

  body {
    font-family: var(--font-sans);
    color: var(--text-primary);
    background: #e8eaf0;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 820px;
    margin: 32px auto;
    background: var(--white);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 28px 40px 24px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 40px; right: 40px;
    height: 2px;
    background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
  }
  .header-top { display: flex; align-items: flex-start; gap: 14px; }
  .header-brand { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .header-logo {
    width: 8px; height: 28px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    border-radius: 2px;
  }
  .header-label {
    font-size: 10px; font-weight: 600; color: var(--gold);
    letter-spacing: .16em; writing-mode: vertical-rl;
  }
  .header-title { font-size: 22px; font-weight: 700; color: #fff; line-height: 1.3; }
  .header-subtitle { font-size: 13px; color: rgba(255,255,255,.5); margin-top: 4px; font-weight: 400; }
  .header-meta { display: flex; gap: 20px; margin-top: 14px; font-size: 12px; color: rgba(255,255,255,.4); }
  .header-meta .meta-item { display: flex; align-items: center; gap: 6px; }
  .header-meta .meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: .6; }

  .cornell {
    display: grid;
    grid-template-columns: 230px 1fr;
    grid-template-rows: auto auto;
    grid-template-areas: "cue notes" "summary summary";
    gap: 0;
  }

  .cornell-cue {
    grid-area: cue;
    background: var(--cue-bg);
    padding: 24px 18px;
    border-right: 1px solid var(--border-light);
  }
  .cue-header {
    font-size: 10px; font-weight: 700; color: var(--cue-accent);
    letter-spacing: .14em; margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(58,71,128,.1);
  }
  .cue-item {
    font-size: 13px; color: var(--cue-accent); line-height: 1.65;
    padding: 10px 12px; margin-bottom: 8px; border-radius: var(--radius);
    background: rgba(58,71,128,.03); border-left: 2px solid transparent; font-weight: 500;
  }
  .cue-item .q-mark {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--cue-accent); color: #fff; font-size: 11px; font-weight: 700;
    margin-right: 8px; flex-shrink: 0;
  }

  .cornell-notes { grid-area: notes; padding: 24px 32px 20px; }
  .notes-header {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    letter-spacing: .14em; margin-bottom: 18px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border-light);
  }
  .note-section { margin-bottom: 16px; }
  .note-section h4 {
    font-size: 14px; font-weight: 700; color: var(--text-primary);
    margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
  }
  .note-section h4 .dot {
    width: 6px; height: 6px; border-radius: 1px;
    background: var(--gold); flex-shrink: 0; transform: rotate(45deg);
  }
  .note-section ul { list-style: none; padding-left: 0; }
  .note-section ul li { padding: 2px 0 2px 20px; position: relative; font-size: 13.5px; line-height: 1.8; }
  .note-section ul li::before {
    content: ''; position: absolute; left: 4px; top: 9px;
    width: 5px; height: 5px; border-radius: 1px; background: var(--gold);
  }
  .note-highlight {
    display: inline; background: linear-gradient(180deg, transparent 60%, var(--gold-pale) 60%);
    padding: 0 2px; font-weight: 600;
  }

  .feynman {
    margin-top: 16px; padding: 18px 20px;
    background: linear-gradient(135deg, #faf8f3, #fefdfa);
    border-radius: var(--radius); border: 1px solid var(--gold-border);
    border-left: 3px solid var(--gold); position: relative;
  }
  .feynman::before {
    content: '"'; position: absolute; left: 12px; top: -4px;
    font-size: 36px; color: var(--gold); opacity: .3; font-family: Georgia, serif; line-height: 1;
  }
  .feynman-label {
    font-size: 10px; font-weight: 700; color: var(--gold);
    letter-spacing: .12em; margin-bottom: 8px; margin-left: 4px;
  }
  .feynman p { font-size: 13.5px; color: #5c4a2e; line-height: 1.8; margin-left: 4px; }
  .feynman p strong { color: #3d2e14; }

  .diagram {
    margin-top: 16px; padding: 18px 20px; background: #fafbfd;
    border-radius: var(--radius); border: 1px solid var(--border-light); overflow-x: auto;
  }
  .diagram-label {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    letter-spacing: .12em; margin-bottom: 14px;
  }
  .flow-row { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; margin: 8px 0; }
  .flow-box {
    background: #fff; border: 1px solid #dde0e6; border-radius: var(--radius);
    padding: 10px 18px; font-size: 13px; font-weight: 500; color: var(--text-primary); text-align: center; white-space: nowrap;
  }
  .flow-box.accent { border-color: var(--gold); background: var(--gold-pale); color: #5c4a2e; font-weight: 700; }
  .flow-box.primary { background: var(--navy); border-color: var(--navy); color: var(--gold); font-weight: 600; }
  .flow-box.warn { border-color: #e0c88e; background: #fffdf8; color: #7a6320; }
  .flow-arrow { width: 32px; color: var(--text-muted); font-size: 16px; flex-shrink: 0; text-align: center; }
  .flow-v-arrow { text-align: center; color: var(--text-muted); font-size: 16px; line-height: 1; margin: 4px 0; }

  .compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .compare-table thead th {
    background: var(--navy); color: rgba(255,255,255,.9); font-weight: 600;
    text-align: left; padding: 9px 14px; font-size: 12px; letter-spacing: .04em;
  }
  .compare-table thead th:first-child { border-radius: var(--radius-sm) 0 0 0; }
  .compare-table thead th:last-child  { border-radius: 0 var(--radius-sm) 0 0; }
  .compare-table tbody td { padding: 9px 14px; border-bottom: 1px solid var(--border-light); font-size: 13px; }
  .compare-table tbody tr:nth-child(even) td { background: #fafbfc; }

  .cornell-summary {
    grid-area: summary;
    padding: 20px 40px 22px;
    background: linear-gradient(180deg, #fafbfd, #fff);
    border-top: 1px solid var(--border);
  }
  .cornell-summary h3 {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    letter-spacing: .14em; margin-bottom: 10px;
  }
  .cornell-summary .summary-text {
    font-size: 15px; font-weight: 600; color: var(--navy); line-height: 1.7;
    padding-left: 14px; border-left: 3px solid var(--gold);
  }
  .cornell-summary .summary-text strong { color: var(--gold); }
  .summary-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .tag {
    font-size: 11px; padding: 4px 12px; border-radius: 3px;
    background: rgba(20,24,41,.04); color: var(--text-secondary); font-weight: 500;
  }
  .tag.primary { background: var(--navy); color: var(--gold); font-weight: 600; }

  /* === 高密度组件 === */
  .numbered-header {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 700; color: var(--navy);
    margin: 18px 0 12px;
  }
  .numbered-header .num {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 24px; height: 24px; padding: 0 6px;
    background: var(--navy); color: var(--gold);
    font-size: 13px; font-weight: 700; border-radius: 2px;
  }

  .vs-block {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 12px; align-items: stretch; margin: 12px 0;
  }
  .vs-col {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .vs-col.vs-old { border-color: #d8d2c4; background: #faf9f6; }
  .vs-col.vs-new { border-color: var(--gold); background: var(--gold-pale); }
  .vs-title { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .vs-old .vs-title { color: var(--text-secondary); }
  .vs-new .vs-title { color: var(--gold); }
  .vs-col ul { list-style: none; }
  .vs-col ul li {
    font-size: 12.5px; color: var(--text-primary); line-height: 1.7;
    padding-left: 14px; position: relative;
  }
  .vs-col ul li::before { content: ''; position: absolute; left: 3px; top: 10px; width: 4px; height: 4px; background: var(--gold); border-radius: 1px; }
  .vs-arrow { display: flex; align-items: center; color: var(--gold); font-size: 20px; }

  .card-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin: 12px 0;
  }
  .card {
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
    border-top: 2px solid var(--navy);
  }
  .card-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--navy); color: var(--gold);
    font-size: 11px; font-weight: 700; margin-bottom: 6px;
  }
  .card-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .card-list { list-style: none; }
  .card-list li {
    font-size: 12.5px; color: var(--text-primary); line-height: 1.7;
    padding-left: 12px; position: relative;
  }
  .card-list li::before { content: '—'; position: absolute; left: 0; color: var(--gold); font-size: 10px; }

  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px; margin: 12px 0;
  }
  .stat-item {
    text-align: center; padding: 12px 8px;
    background: #fafbfd; border: 1px solid var(--border-light);
    border-radius: var(--radius);
  }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--navy); }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .hl-orange { color: #8a6200; background: linear-gradient(180deg, transparent 60%, #f5ecd7 60%); padding: 0 2px; font-weight: 600; }
  .hl-green  { color: var(--accent-green); background: linear-gradient(180deg, transparent 60%, var(--accent-green-soft) 60%); padding: 0 2px; font-weight: 600; }
  .hl-navy   { color: var(--navy); background: linear-gradient(180deg, transparent 60%, #e8ebf5 60%); padding: 0 2px; font-weight: 600; }

  /* === Mobile (≤ 768px) === */
  @media (max-width: 768px) {
    .page { max-width: 100%; margin: 0; box-shadow: none; }
    .header { padding: 20px 16px 16px; }
    .header::after { left: 16px; right: 16px; }
    .header-top { flex-direction: column; gap: 10px; }
    .header-title { font-size: 18px; }
    .header-subtitle { font-size: 12px; }
    .header-meta { flex-wrap: wrap; gap: 12px; font-size: 11px; }
    .header-logo { height: 22px; width: 6px; }

    .cornell {
      grid-template-columns: 1fr;
      grid-template-areas: "cue" "notes" "summary";
    }
    .cornell-cue {
      border-right: none;
      border-bottom: 1px solid var(--border-light);
      padding: 16px;
    }
    .cornell-notes { padding: 16px; }
    .cornell-summary { padding: 16px; }
    .cornell-summary .summary-text { font-size: 14px; padding-left: 12px; }

    .cue-header, .notes-header { font-size: 9px; margin-bottom: 14px; padding-bottom: 10px; }
    .cue-item { font-size: 12px; padding: 8px 10px; }
    .note-section { margin-bottom: 12px; }
    .note-section h4 { font-size: 13px; }
    .note-section ul li { font-size: 12.5px; }

    .feynman, .diagram { margin-top: 14px; padding: 14px; }
    .feynman p { font-size: 12.5px; }
    .feynman::before { left: 8px; top: -2px; font-size: 28px; }

    .vs-block { grid-template-columns: 1fr; gap: 8px; }
    .vs-arrow { justify-content: center; transform: rotate(90deg); padding: 4px 0; }
    .card-grid { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 18px; }

    .flow-row { gap: 2px; }
    .flow-box { padding: 8px 12px; font-size: 12px; }
    .flow-arrow { width: 20px; font-size: 14px; }

    .compare-table { font-size: 11px; display: block; overflow-x: auto; }
    .compare-table thead th, .compare-table tbody td { padding: 6px 8px; }

    .numbered-header { font-size: 14px; margin: 14px 0 10px; }
    .summary-tags { gap: 6px; }
    .tag { font-size: 10px; padding: 3px 10px; }
  }

  @media print {
    body { background: #fff; }
    .page { max-width: 100%; margin: 0; box-shadow: none; page-break-after: always; }
    .header { background: var(--navy) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-top">
      <div class="header-brand"><div class="header-logo"></div><div class="header-label">NOTES</div></div>
      <div><div class="header-title">{{REPORT_TITLE}}</div><div class="header-subtitle">康奈尔笔记 · 一页纸速览</div></div>
    </div>
    <div class="header-meta">
      <div class="meta-item"><span class="meta-dot"></span>{{DATE}}</div>
      <div class="meta-item"><span class="meta-dot"></span>{{AUTHOR}}</div>
      <div class="meta-item"><span class="meta-dot"></span>{{CATEGORY}}</div>
    </div>
  </div>
  <div class="cornell">
    <div class="cornell-cue"><div class="cue-header">▸ 线索</div>{{CUE_ITEMS}}</div>
    <div class="cornell-notes">
      <div class="notes-header">▸ 核心要点</div>{{NOTE_SECTIONS}}
      <div class="feynman"><div class="feynman-label">◆ 费曼</div><p>{{FEYNMAN_EXPLANATION}}</p></div>
      <div class="diagram"><div class="diagram-label">◆ 逻辑关系</div>{{DIAGRAM_CONTENT}}</div>
    </div>
    <div class="cornell-summary">
      <h3>▸ 总结</h3>
      <div class="summary-text">{{SUMMARY}}</div>
      <div class="summary-tags">{{TAGS}}</div>
    </div>
  </div>
</div>
</body>
</html>
