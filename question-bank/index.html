*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-deep:#0a0e17;--bg-card:#111620;--border-default:rgba(255,255,255,.06);--text-primary:rgba(255,255,255,.92);--text-secondary:rgba(255,255,255,.55);--text-muted:rgba(255,255,255,.28);--amber:#fbbf24;--orange:#f97316;--radius:6px;--radius-lg:10px;--font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;--font-mono:'JetBrains Mono','SF Mono','Cascadia Code','Fira Code',monospace}
body{font-family:var(--font-sans);color:var(--text-primary);background:#05080e;background-image:radial-gradient(ellipse at 20% 0%,rgba(249,115,22,.03)0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(251,191,36,.03)0%,transparent 50%);line-height:1.6;min-height:100vh;padding:36px 0}
.container{max-width:800px;margin:0 auto;padding:0 20px}
.back-link{display:inline-block;margin-bottom:20px;color:var(--amber);text-decoration:none;font-family:var(--font-mono);font-size:12px}
.hero{text-align:center;padding:48px 20px 36px;background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);margin-bottom:28px;overflow:hidden;position:relative}
.hero::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,#f97316,var(--amber),transparent)}
.hero-badge{font-family:var(--font-mono);font-size:10px;font-weight:600;color:#f97316;letter-spacing:.2em;margin-bottom:8px}
.hero-title{font-size:28px;font-weight:800;letter-spacing:-.02em}
.hero-title .accent{color:#f97316;text-shadow:0 0 20px rgba(249,115,22,.3)}
.hero-sub{font-size:14px;color:var(--text-muted);margin-top:10px}
.note-card{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-lg);text-decoration:none;color:inherit;margin-bottom:8px;transition:border-color .25s,transform .25s}
.note-card:hover{border-color:rgba(249,115,22,.2);transform:translateY(-1px)}
.note-icon{width:40px;height:40px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:16px;font-weight:700;flex-shrink:0;color:#f97316;background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.15)}
.note-body h3{font-size:16px;font-weight:600;margin-bottom:4px}
.note-body p{font-size:12px;color:var(--text-muted)}
.footer{text-align:center;padding:24px;font-size:12px;color:var(--text-muted)}
</style>
</head>
