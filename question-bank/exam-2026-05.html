var SECNAME = {real:'真题', mock:'模拟'};
var curSec='all', graded=false, elapsed=0, timerInt, ACTIVE=[];

function visible(){ return QUESTIONS.filter(function(q){return curSec==='all'||q.sec===curSec;}); }
function rpad(n){return (n<10?'0':'')+n;}
function fmt(t){var m=Math.floor(t/60),s=t%60;return rpad(m)+':'+rpad(s);}

function renderAll(){
  var host=document.getElementById('questions'), h='';
  QUESTIONS.forEach(function(q,gi){
    var show=(curSec==='all'||q.sec===curSec);
    h+='<div class="q-card'+(show?'':' hide')+'" data-i="'+gi+'" data-sec="'+q.sec+'">';
    h+='<div class="q-head"><span class="q-num">第 '+q.no+' 题</span>';
    h+='<span class="q-sec '+q.sec+'">'+SECNAME[q.sec]+'</span>';
    h+='<span class="q-tag">'+q.cat+'</span></div>';
    h+='<div class="q-stem">'+q.q+'</div><div class="opts">';
    q.opts.forEach(function(o,oi){var L='ABCD'[oi]; h+='<div class="opt" data-l="'+L+'"><b>'+L+'.</b> '+o+'</div>';});
    h+='</div>';
    if(q.notes&&q.notes.length){
      h+='<div class="q-notes"><span class="nl-cap">对应笔记</span>';
      q.notes.forEach(function(n){h+='<a href="'+n[1]+'" target="_blank" rel="noopener">'+n[0]+'</a>';});
      h+='</div>';
    }
    h+='<div class="review" id="rv'+gi+'"></div></div>';
  });
  host.innerHTML=h;
  host.querySelectorAll('.opt').forEach(function(o){
    o.addEventListener('click',function(){
      if(graded)return;
      var card=o.closest('.q-card');
      card.querySelectorAll('.opt').forEach(function(x){x.classList.remove('picked');});
      o.classList.add('picked'); updateAnswered();
    });
  });
  ACTIVE=visible();
  updateAnswered();
}
function updateAnswered(){
  var tot=ACTIVE.length, n=0;
  ACTIVE.forEach(function(q){
    var c=document.querySelector('.q-card[data-i="'+QUESTIONS.indexOf(q)+'"]');
    if(c&&c.querySelector('.opt.picked'))n++;
  });
  document.getElementById('answered').textContent='已答 '+n+' / '+tot;
  document.getElementById('bar').style.width=(tot?(n/tot*100):0)+'%';
}
function grade(){
  graded=true; var right=0,wrong=0,blank=0, tot=0;
  ACTIVE.forEach(function(q){
    var i=QUESTIONS.indexOf(q);
    var c=document.querySelector('.q-card[data-i="'+i+'"]'); if(!c)return; tot++;
    var picked=c.querySelector('.opt.picked'); var L=picked?picked.getAttribute('data-l'):null;
    c.querySelectorAll('.opt').forEach(function(x){
      x.classList.add('locked');
      var xl=x.getAttribute('data-l');
      if(xl===q.ans)x.classList.add('correct');
      if(xl===L)x.classList.add('wrong');
    });
    var review=document.getElementById('rv'+i);
    if(L===q.ans){right++; c.classList.add('correct'); review.innerHTML='<span class="ans">✓ 正确</span> — '+q.why;}
    else if(L){wrong++; c.classList.add('wrong'); review.innerHTML='<span class="ans">✗ 你的答案：'+L+' · 正确答案：'+q.ans+'</span> — '+q.why;}
    else {blank++; c.classList.add('wrong'); review.innerHTML='<span class="ans">未答 · 正确答案：'+q.ans+'</span> — '+q.why;}
    review.classList.add('show');
  });
  clearInterval(timerInt);
  var score=tot?Math.round(right/tot*100):0;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreSub').textContent='答对 '+right+' / '+tot+' 题 · 用时 '+fmt(elapsed);
  document.getElementById('scRight').textContent=right;
  document.getElementById('scWrong').textContent=wrong;
  document.getElementById('scBlank').textContent=blank;
  document.getElementById('scorePanel').classList.add('show');
  document.getElementById('scorePanel').scrollIntoView({behavior:'smooth'});
}
function reset(){
  graded=false; elapsed=0;
  document.getElementById('scorePanel').classList.remove('show');
  renderAll(); startTimer();
}
function startTimer(){
  clearInterval(timerInt);
  document.getElementById('timer').textContent=fmt(150*60);
  timerInt=setInterval(function(){
    elapsed++; var t=150*60-elapsed; if(t<0)t=0;
    document.getElementById('timer').textContent=fmt(t);
    if(t<=0)grade();
  },1000);
}
document.querySelectorAll('#seg button').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('#seg button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); curSec=b.getAttribute('data-sec');
    graded=false; document.getElementById('scorePanel').classList.remove('show');
    renderAll();
  });
});
document.getElementById('gradeBtn').onclick=grade;
document.getElementById('resetBtn').onclick=reset;
renderAll(); startTimer();
</script>
