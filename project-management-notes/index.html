<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目管理 · 知识索引</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#05080e;--card:#111620;--border:rgba(255,255,255,.06);--text:rgba(255,255,255,.92);--text2:rgba(255,255,255,.55);--muted:rgba(255,255,255,.28);--cyan:#00d4ff;--blue:#4d7cff;--purple:#a78bfa;--green:#34d399;--amber:#fbbf24;--rose:#f87171;--radius:8px;--radius-lg:12px;--sans:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
  body{font-family:var(--sans);color:var(--text);background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,rgba(0,212,255,.04)0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(77,124,255,.04)0%,transparent 50%);line-height:1.6;min-height:100vh;padding:40px 16px}
  .wrap{max-width:860px;margin:0 auto}
  .back{display:inline-block;color:var(--cyan);text-decoration:none;font-family:var(--mono);font-size:12px;margin-bottom:16px}
  .hero{text-align:center;padding:44px 20px 32px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:24px;overflow:hidden;position:relative}
  .hero::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--blue),transparent)}
  .hero-badge{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cyan);letter-spacing:.2em;margin-bottom:10px}
  .hero h1{font-size:28px;font-weight:800}.hero h1 .accent{color:var(--cyan);text-shadow:0 0 20px rgba(0,212,255,.3)}
  .hero-sub{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
  .hero-stats{display:flex;justify-content:center;gap:16px;margin-top:18px;flex-wrap:wrap}
  .hero-stat{padding:6px 16px;border-radius:6px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);font-size:13px;color:var(--text2)}
  .hero-stat strong{color:var(--cyan);font-family:var(--mono);font-size:17px}
  .cards{display:grid;grid-template-columns:1fr;gap:8px}
  .note-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;text-decoration:none;color:inherit;transition:border-color .2s,background .2s}
  .note-card:hover{border-color:rgba(0,212,255,.2);background:rgba(0,212,255,.02)}
  .note-icon{width:38px;height:38px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:700}
  .ic-cyan{background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.25);color:var(--cyan)}
  .ic-purple{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);color:var(--purple)}
  .ic-amber{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.25);color:var(--amber)}
  .note-info{flex:1}.note-info h3{font-size:15px;font-weight:700;margin-bottom:2px}
  .note-info p{font-size:12px;color:var(--muted);line-height:1.5}
  .note-arrow{color:var(--muted);font-size:16px}
  .note-card:hover .note-arrow{color:var(--cyan)}
  .footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .footer a{color:var(--cyan);text-decoration:none}
</style>
</head>

</html>
